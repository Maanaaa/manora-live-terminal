# Configuration de l'analyse SonarQube / SonarCloud.
# Le token (secret SONAR_TOKEN) et l'URL (variable SONAR_HOST_URL, SonarCloud par défaut) viennent de GitHub.

sonar.projectKey=Maanaaa_manora-live-terminal
sonar.projectName=Manora Live — passerelle
sonar.organization=maanaaa

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.sourceEncoding=UTF-8

sonar.exclusions=node_modules/**,dist/**,data/**,**/*.json
